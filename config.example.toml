# Скопируйте этот файл в hh-data/config.toml (из исходников) и поправьте под себя.
# Для Docker используйте config.server.example.toml; команды описаны в SERVER_RU.md.

# Ссылка на поиск вакансий hh.ru. Удобнее всего взять её со страницы резюме:
# «Мои резюме» → «N подходящих вакансий» — тогда в ссылке будет параметр resume=<ID резюме>.
search_url = "https://hh.ru/search/vacancy?resume=ВАШ_ID_РЕЗЮМЕ&from=resumelist"

# Ссылка на резюме для проверки (https://hh.ru/resume/<ID>).
# Можно оставить пустой — тогда ID берётся из параметра resume= в search_url.
resume_url = ""

# Если в окне отклика hh подставил другое резюме — пропускать вакансию.
skip_on_resume_mismatch = true

[search]
# Откуда брать вакансии:
#   "resume" — по ссылке search_url выше (обычно «подходящие к резюме»);
#   "query"  — общий поиск hh по тексту query (как в строке поиска на hh.ru)
mode = "resume"
query = ""                 # например: "python разработчик" или "backend OR бэкенд"
# Несколько запросов — по одному на строку: за запуск программа пройдёт их по очереди, лимит откликов общий,
# одна и та же вакансия дважды не попадётся:
# query = """
# python разработчик
# backend python
# """
area = ""                  # регион hh: "1" — Москва, "2" — Санкт-Петербург, "113" — вся Россия; "" — как в профиле
title_only = false         # true — искать запрос только в названии вакансии

[limits]
max_responses = 10         # откликов за один запуск; общий дневной лимит задан ниже
max_pages = 3              # страниц выдачи
delay_min = 10             # пауза между вакансиями, сек (случайная в диапазоне)
delay_max = 15
page_delay_min = 10        # пауза перед следующей страницей выдачи
page_delay_max = 15
action_delay_min = 0.6     # пауза между кликами внутри одной вакансии
action_delay_max = 1.6
max_consecutive_errors = 5 # столько ошибок подряд → аварийная остановка
# Сохраняемая политика: 0 отключает соответствующее новое ограничение для старых конфигов.
submission_interval_seconds = 180  # минимальный интервал отправок откликов, сек
submission_batch_size = 2          # после серии сервер закрывает браузер и продолжает позже
submission_batch_pause_minutes = 25  # обычная пауза откликов; проверка роботов продолжает работать
captcha_cooldown_minutes = 120      # после CAPTCHA все фоновые запросы к hh приостанавливаются
read_interval_seconds = 10         # минимальный интервал чтения страниц, сек
max_responses_per_day = 10         # подтверждённые + сегодняшние с неясной доставкой, Europe/Moscow
# Старый адаптивный таймер нужен только старым конфигам без новой политики отправок.
# При включённой новой политике программа выключает его, чтобы таймеры не складывались.
captcha_rest = 0
# Не больше стольких откликов в одну компанию за per_company_days дней (0 — без ограничения). У крупной
# компании бывает десяток похожих вакансий — откликнемся только на первые. «ООО "Ромашка"» и «Ромашка» —
# одна компания. Считаются отклики этой программы.
per_company = 0
per_company_days = 30

[hh_filters]
# Фильтры самого hh — подставляются в ссылку поиска вместо тех, что в ней есть. Пусто / 0 / false — фильтр
# не задан: на hh это «выбрано всё». Можно настроить фильтры на hh.ru и скопировать адрес в search_url.
order_by = ""              # "" — по соответствию; "publication_time" по дате; "salary_desc" / "salary_asc"
                           # по убыванию / возрастанию зарплаты; "distance" по удалённости от дома
search_period = 0          # 0 — за всё время, 7 — за неделю, 3 — за три дня, 1 — за сутки
# График: FIVE_ON_TWO_OFF (5/2), SIX_ON_ONE_OFF, FOUR_ON_THREE_OFF, FOUR_ON_TWO_OFF, FOUR_ON_FOUR_OFF,
#   THREE_ON_THREE_OFF, THREE_ON_TWO_OFF, TWO_ON_TWO_OFF (2/2), TWO_ON_ONE_OFF, ONE_ON_THREE_OFF, ONE_ON_TWO_OFF,
#   WEEKEND (по выходным), FLEXIBLE (свободный), OTHER (другое)
work_schedule_by_days = []
# Рабочие часы в день: HOURS_2 … HOURS_12, HOURS_24, FLEXIBLE (по договорённости), OTHER
working_hours = []
# Опыт: noExperience, between1And3, between3And6, moreThan6
experience = []
# Формат: REMOTE (удалённо), HYBRID (гибрид), ON_SITE (на месте работодателя), FIELD_WORK (разъездной)
work_format = []
salary = 0                 # уровень дохода от, ₽; 0 — не важно
salary_mode = ""           # за что указан доход: MONTH, SHIFT (смена), HOUR, FLY_IN_FLY_OUT (вахта), SERVICE
# Частота выплат: DAILY, WEEKLY, TWICE_PER_MONTH, MONTHLY, PER_PROJECT
salary_frequency = []
# Тип занятости: FULL (полная), PART (частичная), PROJECT (подработка), FLY_IN_FLY_OUT (вахта)
employment_form = []
accept_temporary = false   # оформление по ГПХ или по совместительству
# Специализации — номера из справочника hh: 96 — программист,
# 160 — DevOps-инженер, 104 — руководитель группы разработки, 165 — дата-сайентист …
professional_role = []
# Компании — номера из ссылки hh.ru/employer/<номер> (можно вставить саму ссылку)
employer_id = []
# Отрасль компании — номера hh: "7" — ИТ, системная интеграция, интернет; подотрасль — "7.540" и т.п.
industry = []
excluded_text = ""         # слова-исключения: hh не покажет вакансии с ними
# Образование: not_required_or_not_specified (не требуется или не указано), special_secondary, higher
education = []
# Другие параметры: not_from_agency (без кадровых агентств), with_address, accept_labor_contract (трудовой договор),
#   accredited_it (аккредитованные ИТ-компании), with_salary (указан доход), internship (стажировка),
#   low_performance (меньше 10 откликов), night_shifts (вечерние/ночные смены), accept_kids (с 14 лет)
label = []
# Особенности здоровья: CHRONIC_DISEASES, MOBILITY, HEARING, VISION, MENTAL, UNSPECIFIED (категория не указана)
inclusiveness_types = []
# Где искать слова запроса (для [search] mode = "query"): name, company_name, description
search_field = []

[filters]
# Требовать явное подтверждение ГПХ по данным полной вакансии hh перед откликом.
# Совместительство само по себе не подходит. Неизвестный формат / ошибка проверки — пропуск.
require_gph = false
# Вместе с require_gph: допускать также вакансии, где оформление не указано.
# Только ТК и ошибки получения данных по-прежнему не проходят.
gph_allow_unspecified = false
# Фильтры программы: названия проверяются по карточке, описание — по полному тексту перед откликом.
# Слова в названии вакансии, при которых она пропускается без отклика (регистр не важен)
# Например: ["преподавател", "менеджер по продаж", "менеджер продаж", "sales manager"].
exclude_title_words = []
# Исключения в названии, сниппете и полном описании. Например: ["Битрикс24", "amoCRM"].
# Для этих CRM учитываются русские/английские названия, пробелы и дефисы. Просто «CRM» не исключается.
# Если описание не загрузилось, вакансия пропускается с причиной в журнале. Пустой список отключает проверку.
exclude_description_words = []
# Слова в названии КОМПАНИИ, при которых вакансия пропускается (регистр не важен).
# Например: ["сбер", "тинькофф"] — «Сбер», «СберТех», «Сбербанк» будут пропущены
exclude_company_words = []
# Откликаться ТОЛЬКО в компании, в названии которых есть хотя бы одно из слов (регистр не важен).
# Пусто — проверка не делается. Например: ["яндекс", "тинькофф", "ozon"]
include_company_words = []
# Откликаться ТОЛЬКО на вакансии, где есть хотя бы одно из этих слов (регистр не важен).
# Пусто — откликаться на все. Например: ["python", "backend", "django"]
include_words = []
include_in_snippet = false # true — искать слова и в описании из карточки, не только в названии
# Уровни, на которые откликаться: "intern", "junior", "middle", "senior", "lead". Пусто — на любые.
# Пропускается вакансия, в названии которой явно указан другой уровень («Junior Python» при ["senior"]);
# если уровня в названии нет — отклик будет. Опыт работы в годах — фильтр hh ([hh_filters] experience).
levels = []
# true — нежелательные вакансии не только пропускать, но и скрывать на hh («глаз» в карточке → «Скрыть эту
# вакансию»): в выдаче они больше не появятся, страницы выдачи заполняются подходящими. Скрываются отсеянные
# фильтрами по словам, уровнем, отбором ([quality]) и ИИ-фильтром; уже просмотренные, лимиты и анкеты — нет.
# Вернуть скрытую вакансию можно на самом hh, в списке скрытых. В пробном прогоне ничего не скрывается.
hide_unwanted = false

[quality]
# Отбор по данным, которые hh отдаёт вместе с выдачей: без лишних переходов и кликов.
# hh предупреждает о вакансии (вводит в заблуждение, перепродажа персональных данных), работодатель
# не подтверждён или на дополнительной проверке — пропускать
skip_suspicious = true
skip_messengers = true     # в описании просят писать в Telegram, WhatsApp и т.п. — частый признак обмана
skip_complaints = false    # на работодателя часто жалуются / есть нарушения правил hh (бывает и у крупных компаний)
max_age_days = 90          # вакансия создана раньше — «вечная», её месяцами переопубликуют; 0 — не проверять
max_responses = 0          # откликов на вакансию больше — ваш, скорее всего, не прочитают; 0 — не проверять
min_rating = 0             # рейтинг работодателя по отзывам ниже (при 5+ отзывах) — пропускать; 0 — не проверять

[letter]
# Как писать сопроводительное письмо:
#   "generate" — кнопкой hh «Сгенерировать» (нужна подписка hh); если кнопки нет или генерация не удалась,
#                а ИИ включён ([ai] enabled) — письмо пишет нейросеть,
#   "ai"       — письмо пишет нейросеть из [ai] по резюме и описанию вакансии (подписка не нужна),
#   "template" — готовым текстом template_text (подписка не нужна),
#   "none"     — откликаться без письма (вакансии, где письмо обязательно, пропускаются)
mode = "generate"
# Текст для mode = "template". {vacancy} и {company} заменяются на название вакансии и компанию.
template_text = """Здравствуйте!

Меня заинтересовала вакансия «{vacancy}» в компании {company}. Буду рад обсудить, чем могу быть полезен.
"""
generate_timeout = 60      # сколько ждать, пока «Сгенерировать» заполнит письмо, сек
min_length = 30            # письмо короче считается несгенерированным
ai_max_chars = 900         # длина письма нейросети, символов
# Запасной текст, если генерация не удалась. Пусто — такая вакансия пропускается
# (или, если отклик уже ушёл без окна, остаётся без письма).
fallback_text = ""
# Письмо нейросети начинается с вашего опыта под вакансию, а не с пересказа компании — такие письма,
# по опыту откликов, чаще приводят к приглашению
experience_first = true
# Свой промпт для письма нейросети: тон, структура, что упоминать, а что нет. Важнее встроенных правил.
# Что напишете здесь о себе, нейросеть считает фактом, как и контекст ([ai] context).
# Кнопка hh этот промпт не использует.
# Например: "Пиши по-простому, как живой человек. Не упоминай компанию и вакансию."
ai_prompt = ""

[questions]
# Если работодатель задаёт ровно ОДИН вопрос и он о зарплате — отвечаем этим текстом,
# прикладываем сгенерированное письмо и откликаемся. Остальные вопросы пока пропускаются.
answer_salary = true
salary_answer = "Рассматриваю от 100"
# Если включён ИИ ([ai] enabled) — анкеты при отклике заполняет нейросеть: любые вопросы, текст и варианты.
# Зарплата и сроки — по вашему контексту ([ai] context), технологии — строго по резюме.
# Подтверждённый профиль дополняет резюме; отсутствие навыка в резюме не означает отсутствия опыта.
max_ai_questions = 15      # анкеты длиннее пропускаются (обычно это тесты)
# По этим словам вопрос считается вопросом о зарплате (когда ИИ выключен)
salary_keywords = ["зарплат", "заработн", "сумм", "доход", "оклад", "вознагражд", "компенсац", "з/п", "₽", "руб"]
# Пропускать анкеты с вариантами ответа (тесты): по опыту откликов они почти не приводят к приглашению
skip_tests = false
# Пропускать любые вопросы работодателя при отклике. Такие вакансии видно ещё в выдаче — без клика
skip_all = false

[relocation]
# Предупреждение hh «вакансия в другом регионе/стране»: соглашаемся, если переезд не нужен.
confirm_other_region = true   # false — всегда отказываться от таких вакансий
decline_if_not_remote = true  # другой регион без «Можно удалённо» = придётся переезжать → отказ
# Слова в карточке вакансии, означающие переезд → отказ
decline_keywords = ["переезд", "переех", "релокац", "перемещ", "relocat"]

[chats]
# Для скрипта scripts/chats.py: открывает чаты с отказами и отвечает роботам при включённом ИИ.
# Что делать: "all" — прочитать отказы и ответить ИИ на анкеты (если включён [ai]);
#             "rejections" — только прочитать отказы, остальные чаты не трогать (даже с включённым ИИ)
mode = "all"
url = "https://hh.ru/chat"
rejection_text = "Отказ"   # последнее сообщение чата, по которому узнаём отказ
delay_min = 0.5            # пауза после открытия чата, чтобы hh отметил его прочитанным
delay_max = 1.0

[ai]
# ИИ-ответы на анкеты «Робота-рекрутера» в чатах hh (python scripts/chats.py).
# Нейросеть получает ваше резюме с hh, контекст ниже и переписку и отвечает коротко от вашего имени.
enabled = false
# Где нейросеть (OpenAI-совместимый API):
#   "openai"     — прямой OpenAI API, ключ OPENAI_API_KEY из .env; модель по умолчанию gpt-6.1-terra;
#   "openrouter" — openrouter.ai, есть БЕСПЛАТНЫЕ модели, нужен ключ. По умолчанию — "openrouter/free":
#                  OpenRouter сам выбирает бесплатную модель из работающих. Конкретные бесплатные — с пометкой
#                  :free на openrouter.ai/models, но со временем они становятся платными;
#   "deepseek"   — api.deepseek.com, платно, но копейки; нужен ключ с platform.deepseek.com;
#   "ollama"     — нейросеть на вашем компьютере (ollama.com), бесплатно, ключ не нужен;
#   "custom"     — любой другой: укажите base_url и model
provider = "openrouter"
api_key = ""               # лучше оставить пустым: HH_AI_API_KEY или OPENAI_API_KEY (для openai) из .env
model = ""                 # пусто — модель по умолчанию для провайдера
base_url = ""              # пусто — адрес провайдера. Ollama на другом компьютере: "http://192.168.1.50:11434"
                           # или "http://localhost:11435" через SSH-туннель — см. docs/ollama.md
# Что ещё знать о вас кроме резюме: зарплатные ожидания, формат, город, когда готовы выйти, и т.п.
# Это ваши слова: если здесь есть ответ на вопрос работодателя, нейросеть ответит так, как вы написали.
# Например: "Живу в Москве, гражданство РФ. Ожидаю от 150 000 ₽ на руки. Могу выйти через 2 недели."
context = ""
# Необязательный профиль подтверждённых навыков, проектов и уточнений. Путь — от папки этого config.toml.
# Шаблон: candidate_profile.example.toml. Заполните своими фактами и сохраните, например,
# в hh-data/data/candidate_profile.toml; тогда укажите "data/candidate_profile.toml".
profile_path = ""
# Необязательные расширенные кейсы и подтверждённые примеры ответов, пути от папки этого конфига.
competency_map_path = ""
profile_notes_path = ""
# Свой промпт для ответов в чатах и анкетах: как писать — стиль, тон, длина. Важнее встроенных правил о стиле;
# факты — из резюме, подтверждённого профиля и контекста. Пропуск навыка в резюме не означает отсутствия опыта.
# Письмо — отдельно: [letter] ai_prompt.
# Например, чтобы ответы не звучали как ChatGPT (многострочный текст — в тройных кавычках):
#   Пиши от моего лица простым разговорным языком, как разработчик, который отвечает своими словами.
#   Начинай с маленькой буквы, аббревиатуры пиши маленькими буквами без дефисов («ai агенты», «mcp серверы»).
#   Не используй длинное тире и точку с запятой, вместо двоеточия ставь запятую, в конце последнего предложения
#   точку не ставь. Без канцелярита, вступлений вроде «я считаю», «на мой взгляд», шаблонов вроде «не только X,
#   но и Y», «важно понимать, что» и выводов в конце. Можно технический сленг: скиллы, контекст, промпт, апишка.
#   Обычно 2–4 предложения, можно одно-два. Текст должен выглядеть так, будто я быстро написал его сам,
#   но технически ответ должен оставаться правильным.
answer_prompt = ""
# true — на вопрос «Готовы ли вы предоставить документы?» (выписка из ЭТК, договоры) отвечать «да».
# false — такие анкеты пропускаются, а чаты остаются вам. Сами документы программа никуда не отправляет.
documents_ready = false
# false — отвечать всем (ботам и живым рекрутерам); true — только ботам hh из robot_markers.
# Встречи, собеседования и звонки, просьбы прислать документы, контакты и деньги программа в любом случае оставляет вам.
only_robot = false
robot_markers = ["Робот-рекрутер", "ИИ-помощник", "ассистент рекрутера", "на базе AI", "на базе ИИ"]
max_answer_chars = 300     # максимальная длина одного ответа
reply_wait = 25            # сколько ждать следующего вопроса робота после ответа, сек
max_answers_per_chat = 20
timeout = 60               # сколько ждать ответа нейросети, сек
candidate_gender = "male"

[ai_filter]
# ИИ-фильтр вакансий: перед откликом нейросеть читает название и сниппет карточки и решает,
# подходит ли вакансия под ваше описание. Не подходит — отклика не будет (вакансия просто пропускается).
# Использует ту же нейросеть, что и [ai] (адрес, модель, ключ — там же).
enabled = false
# Что вы ищете и чего не хотите — своими словами. Это описание уходит нейросети в каждой вакансии:
criteria = ""
max_snippet_chars = 800    # сколько символов описания карточки отправлять нейросети (0 — целиком)
skip_on_error = false      # true — при сбое ИИ вакансия пропускается; false — обрабатывается как обычно

[browser]
backend = "playwright"      # playwright | seleniumbase_uc (Linux: полный Chrome + внутренний Xvfb)
channel = ""               # chrome | msedge | "" (встроенный Chromium Playwright)
headless = true            # UC на Linux использует невидимый Xvfb; локальный вход — scripts/session.py
profile_dir = "browser-profile"
slow_mo = 0                # замедление каждого действия Playwright, мс (для отладки)
login_timeout = 600        # сколько ждать ручного входа, сек

# Совместимость с оконным входом; на сервере headless=true, эти параметры не включают видимый браузер.
hide_window = false
show_on_captcha = false

[geo]
# hh.ru работает только из России. Если вы за границей или сидите через VPN —
# добавьте hh.ru в исключения VPN или укажите российский прокси:
#   "http://user:pass@1.2.3.4:8080"  или  "socks5://1.2.3.4:1080" (socks5 — без логина/пароля)
proxy = ""
locale = "ru-RU"
timezone = "Europe/Moscow"
check_ip = true            # перед стартом показать страну внешнего IP (запрос к ipinfo.io)
require_ru_ip = false      # true — не запускаться, если IP не российский

[logs]
# При ошибке программа сохраняет скриншот и HTML страницы в logs/snapshots — по ним видно, что пошло не так,
# если hh поменял вёрстку. Один снимок весит 1–3 МБ. Не нужны — поставьте false.
snapshots = true
# Снимки старше стольких дней удаляются сами при запуске (за пару недель их набегает пара сотен МБ). 0 — хранить всё.
keep_days = 14

[notify]
# Уведомление, когда запуск закончился: сколько отправлено, пропущено, ошибок. По умолчанию выключено.
desktop = false            # системное уведомление (Windows, macOS; на Linux нужен notify-send)
telegram = false           # сообщение от вашего Telegram-бота — удобно, если программа крутится на сервере
telegram_token = ""        # токен от @BotFather (можно не писать сюда, а задать HH_TELEGRAM_TOKEN)
telegram_chat_id = ""      # напишите боту и откройте
                           # https://api.telegram.org/bot<токен>/getUpdates → chat.id
# Сразу сообщать о приглашении в чате — в те же каналы (компьютер, Telegram), что включены выше.
# Приглашение видно при запуске scripts/chats.py и фоновой проверке ([watch]).
invitations = true
# Капча — в Telegram (нужен telegram = true выше): бот пришлёт картинку, ответьте ему символами с неё (слова — через
# пробел) — программа введёт их в браузер по буквам. Окно браузера само не всплывает ([browser] show_on_captcha),
# но решить капчу в нём тоже можно, кто первый. Не подошло — придёт новая картинка, «другая» в ответ — другая
# картинка. Работает и без окна браузера ([browser] headless = true, например в Docker). По умолчанию выключено.
telegram_captcha = false

[schedule]
# Отклики по расписанию выполняет scripts/server.py. Задания и ответы роботам идут последовательно.
enabled = false
times = ["10:00"]          # время в часовом поясе scripts/server.py --timezone, по умолчанию Europe/Moscow
days = ["1", "2", "3", "4", "5"]  # дни недели: "1" — понедельник … "7" — воскресенье
chats_after = false        # после откликов прочитать отказы в чатах (и ответить ботам, если включён [ai])
# Параметр совместимости; постоянную работу сервера обеспечивает Docker restart policy.
keep_awake = false

[raising]
# Поднятие резюме в поиске hh — бесплатно, раз в 4 часа, как кнопка «Поднять в поиске» на странице «Мои резюме».
# Тот же вход, что для откликов. Отдельная команда: scripts/raise_resume.py.
# Ещё резюме поднимается в начале запуска, если подошло время и enabled=true.
enabled = false
all_resumes = false        # false — только резюме из resume_url или resume= в ссылке поиска (нет его — все)

[watch]
# Автоматически отвечать на новые вопросы только роботов-помощников hh.
# Проверку выполняет scripts/server.py: прочитанные и непрочитанные чаты за последние 30 дней.
# Живые рекрутеры и неизвестные отправители остаются вам.
robot_replies = false
robot_every_minutes = 15   # интервал после окончания проверки, а не срок ответа в каждом чате
robot_max_chats_per_check = 10  # открытий за цикл; полный список за 30 дней остаётся в очереди
robot_reply_interval_seconds = 30  # минимальный интервал отправок ответов роботам, сек
# Интервал других фоновых задач; разовая проверка — scripts/watch.py.
invitations = false        # смотреть чаты: пришло приглашение — сразу сообщить ([notify] invitations)
every_minutes = 60         # как часто проверять (не чаще раза в 15 минут)

[dream]
# «Компании мечты»: их свежие вакансии проверяются при каждой фоновой проверке ([watch] every_minutes),
# и отклик уходит сразу — раньше остальных откликнувшихся. Те же фильтры, письмо и анкеты, что у откликов.
enabled = false
companies = []             # ссылки на страницы компаний: ["https://hh.ru/employer/2180", "1740"]
max_per_check = 5          # откликов за одну проверку

[stats]
# Счётчики по дням — сколько отправлено, с письмом, пропущено и почему,
# отказов и ответов ИИ в чатах. Без названий вакансий, компаний и текстов. Файл data/stats.json.
disabled = false           # true — не вести статистику: ничего не записывается
keep_days = 365            # дни старше удаляются сами; 0 — хранить всё
# Воронка: что стало с откликами — приглашения и отказы из чатов — по запросам, видам письма и совпадению
# навыков. Считается из истории откликов (data/responses.jsonl) и статусов чатов (data/negotiations.json)
funnel = true
# Советы к резюме: какие ключевые навыки чаще всего просят в вашей выдаче и есть ли они в резюме
# (data/skills.json — только навыки и числа). Заодно вакансии выдачи (название, навыки, требования, зарплата,
# опыт; без компаний) копятся в data/market.json — 45 дней, не больше 15 000
skill_tips = true
